# Publica una versión de Relevo.
#
# Al subir un tag como v1.0.1 (la misma versión que dice Cargo.toml), GitHub:
#   1. revisa que el tag y la versión coincidan,
#   2. corre las pruebas en Windows,
#   3. arma el instalador con herramientas\empaquetar.ps1 (con ffmpeg incluido),
#   4. crea la Release con Relevo-X.Y.Z-Instalador.exe adjunto.
# Las PCs con Relevo lo ven solas y avisan «Relevo X.Y.Z disponible».
#
# También se puede correr a mano (Actions → Publicar versión → Run workflow): entonces
# solo arma el instalador y lo deja para descargar en esa ejecución, sin publicar nada.

name: Publicar versión

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Caché de compilación
        uses: Swatinem/rust-cache@v2

      - name: Revisar que el tag coincide con la versión de Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") {
            throw "El tag ${{ github.ref_name }} no coincide con la versión de Cargo.toml ($v). Cambia la versión en Cargo.toml o usa el tag v$v."
          }
          "Versión $v"

      - name: Pruebas
        run: cargo test --workspace

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Armar el instalador
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File herramientas\empaquetar.ps1

      - name: Publicar la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Relevo ${{ github.ref_name }}
          files: instalador/salida/Relevo-*-Instalador.exe
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Guardar el instalador (ejecución a mano)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Relevo-instalador
          path: instalador/salida/Relevo-*-Instalador.exe
          if-no-files-found: error
